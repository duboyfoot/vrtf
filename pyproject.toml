[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kappa-combustion"
version = "0.1.0"
description = "Bibliothèque de calculs de combustion (Kappa Dubois)"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["combustion*"]

[tool.setuptools.package-data]
combustion = ["data/*.csv"]
